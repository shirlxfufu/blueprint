name: Deploy Icon Comparison Demo

on:
  push:
    branches:
      - icon-comparison-fresh
    paths:
      - 'packages/demo-icon-comparison/**'
      - '.github/workflows/deploy-icon-comparison.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile required packages with dependencies
        run: |
          pnpm --filter @blueprintjs/test-commons compile
          pnpm --filter @blueprintjs/colors compile
          pnpm --filter @blueprintjs/icons compile
          pnpm --filter @blueprintjs/core compile

      - name: Build demo app
        run: cd packages/demo-icon-comparison && NODE_ENV=production pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/demo-icon-comparison/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
